# Runs `npx @postman/postman-plugin` against the latest release of every agent
# it supports, on Linux and Windows. The unit tests pin the commands the
# installer sends; this checks the agents still accept them, and that each one
# then reports Postman (Cursor isn't installed, so its files are checked instead).
# They install from GitHub or npm, not from this checkout, so it tests the
# installer, not a branch's skills; only the route harness steps at the end load
# this checkout, each into the latest release of its agent. It also runs nightly, because an agent release breaks the installer
# without anyone pushing here, and the release-installer skill dispatches it on
# the commit it is about to tag.
name: Installer smoke
# A dispatched run is named after its commit, which release.mjs smoke finds it by.
run-name: ${{ inputs.ref && format('Installer smoke on {0}', inputs.ref) || '' }}

on:
  push:
    branches: ['main']
    paths: ['installer/**', 'opencode/**', 'scripts/lib/**', 'scripts/*-harness.js', '.github/workflows/installer-smoke.yml']
  pull_request:
    paths: ['installer/**', 'opencode/**', 'scripts/lib/**', 'scripts/*-harness.js', '.github/workflows/installer-smoke.yml']
  schedule:
    - cron: '23 4 * * *'
  # The release-installer skill passes the exact commit it is about to tag.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag to smoke-test; empty for the branch dispatched on.'
        required: false
        type: string

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Every other run gets a group
# of its own: a group holds one pending run, so sharing one could drop a release's smoke run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Installer against real CLIs / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    env:
      # Kimi Code has no uninstall command, so it is removed on its own below.
      REMOVABLE: claude-code,codex,cursor,factory,opencode,pi
    defaults:
      run:
        shell: bash
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Build
        run: npm ci && npm run build

      - name: Install the agent CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex droid @earendil-works/pi-coding-agent opencode-ai

      - name: Install Kimi Code
        if: runner.os != 'Windows'
        run: |
          # The vendor's download host sometimes times out; a second try usually gets through.
          for attempt in 1 2 3; do
            curl -fsSL --retry 3 https://code.kimi.com/kimi-code/install.sh | bash && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 15
          done
          echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"

      - name: Install Kimi Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://code.kimi.com/kimi-code/install.ps1 | iex
          "$HOME\.kimi-code\bin" >> $env:GITHUB_PATH

      # Cursor isn't installed; the installer finds it by the home directory its app or CLI creates on first run.
      - name: Give Cursor a home directory
        run: |
          node -e 'require("fs").mkdirSync(require("path").join(require("os").homedir(), ".cursor"), { recursive: true })'

      - name: Kimi Code runs
        run: kimi --version

      - name: Install, then re-run to take the update path
        run: |
          node dist/cli.js install --yes --agent "$REMOVABLE,kimi"
          node dist/cli.js install --yes --agent "$REMOVABLE,kimi"

      - name: Each agent has Postman
        run: node scripts/smoke-check.js installed ${REMOVABLE//,/ } kimi

      - name: Remove, and no agent has Postman
        run: |
          node dist/cli.js remove --yes --agent "$REMOVABLE"
          node scripts/smoke-check.js removed ${REMOVABLE//,/ }

      - name: Kimi Code is left for its own /plugins command, which the installer says
        run: |
          status=0
          node dist/cli.js remove --yes --agent kimi | tee "$RUNNER_TEMP/kimi-remove.txt" || status=$?
          test "$status" -eq 3
          grep -F '/plugins remove postman' "$RUNNER_TEMP/kimi-remove.txt"
          node scripts/smoke-check.js installed kimi

      # The pinned harness in validate.yml, against the Pi release installed above. Each harness
      # runs even when one before it failed, so one agent's failure can't hide another's.
      - name: The latest Pi loads the packed tarball
        if: ${{ !cancelled() }}
        run: npm run test:pi-harness

      # The pinned harness in validate.yml, against the Droid release installed above.
      - name: The latest Droid loads this checkout
        if: ${{ !cancelled() }}
        run: node ../scripts/factory-harness.js

      # The pinned harnesses in validate.yml, against the releases installed above.
      - name: The latest Claude Code loads this checkout
        if: ${{ !cancelled() }}
        run: node ../scripts/claude-code-harness.js

      - name: The latest Codex loads this checkout
        if: ${{ !cancelled() }}
        run: node ../scripts/codex-harness.js

      - name: The latest Kimi Code loads this checkout
        if: ${{ !cancelled() }}
        run: node ../scripts/kimi-harness.js

      # Installed only now: before the installer ran, Cursor had to be found by its home directory alone.
      # Linux only: the Cursor CLI on Windows runs no sessionStart hook headless
      # (https://github.com/postmanlabs/postman-plugin/issues/83).
      - name: Install the Cursor CLI
        if: ${{ !cancelled() && runner.os != 'Windows' && github.event.pull_request.head.repo.fork != true }}
        run: |
          # The vendor's download host sometimes times out; a second try usually gets through.
          for attempt in 1 2 3; do
            curl -fsSL --retry 3 https://cursor.com/install | bash && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 15
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Windows, once https://github.com/postmanlabs/postman-plugin/issues/83 is fixed:
      # - name: Install the Cursor CLI
      #   if: ${{ !cancelled() && runner.os == 'Windows' && github.event.pull_request.head.repo.fork != true }}
      #   shell: pwsh
      #   run: |
      #     irm 'https://cursor.com/install?win32=true' | iex
      #     "$env:LOCALAPPDATA\cursor-agent" >> $env:GITHUB_PATH

      # A fork's pull request gets no secrets, and the Cursor CLI runs only on Cursor's model.
      - name: The latest Cursor CLI loads this checkout
        if: ${{ !cancelled() && runner.os != 'Windows' && github.event.pull_request.head.repo.fork != true }}
        run: node ../scripts/cursor-harness.js
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

      # Both OpenCode steps below run from here.
      - name: Install the OpenCode package's dependencies
        if: ${{ !cancelled() }}
        working-directory: opencode
        run: npm ci

      # The pinned harness in validate.yml, against the OpenCode release installed above.
      - name: The latest OpenCode loads the skills
        if: ${{ !cancelled() }}
        working-directory: opencode
        # npm puts global bins in the prefix itself on Windows, in its bin/ elsewhere.
        run: |
          OPENCODE_BIN=$(node -p 'require("path").join(process.argv[1], process.platform === "win32" ? "opencode.cmd" : "bin/opencode")' "$(npm prefix -g)")
          export OPENCODE_BIN
          npm run test:harness

      # The pinned plugin-add harness in validate.yml, against the latest OpenCode 1 installed above and the
      # latest OpenCode 2, so a release that stops loading Postman through `opencode plugin` fails here. Beyond
      # the local copy and the packed tarball it installs what users run: `github:postmanlabs/postman-plugin`
      # from GitHub and, nightly, `@postman/postman-plugin` from npm.
      - name: The latest OpenCode installs Postman with `plugin`
        if: ${{ !cancelled() }}
        working-directory: opencode
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode2" @opencode/cli@latest
          # npm puts global bins in the prefix itself on Windows, in its bin/ elsewhere.
          OPENCODE1=$(node -p 'require("path").join(process.argv[1], process.platform === "win32" ? "opencode.cmd" : "bin/opencode")' "$(npm prefix -g)")
          OPENCODE2=$(node -p 'require("path").join(process.argv[1], "node_modules", ".bin", process.platform === "win32" ? "opencode.cmd" : "opencode")' "$RUNNER_TEMP/opencode2")

          # A pull request installs its own head commit; a dispatch, the commit it was given; main and the
          # nightly run, the bare command the README documents.
          spec=github:postmanlabs/postman-plugin
          if [ -n "$PR_SHA" ]; then spec="$spec#$PR_SHA"; elif [ -n "$INPUT_REF" ]; then spec="$spec#$INPUT_REF"; fi

          for opencode in "$OPENCODE1" "$OPENCODE2"; do
            for route in git npm; do
              OPENCODE_BIN="$opencode" node scripts/test-plugin-add.js "$route"
            done

            if [ "$FORK" = true ]; then
              echo "::notice::the github route is not run for a fork's pull request: its head commit is not on postmanlabs/postman-plugin"
            else
              OPENCODE_BIN="$opencode" PLUGIN_ADD_SPEC="$spec" node scripts/test-plugin-add.js github
            fi

            # The published package changes only when the installer is released, so only the nightly run asks
            # for it. It fails until the first release that ships the OpenCode entrypoint.
            if [ "$EVENT" = schedule ]; then
              OPENCODE_BIN="$opencode" node scripts/test-plugin-add.js registry
            fi
          done
