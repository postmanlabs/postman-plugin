# The manifest carries a sha256 per file, and `postman init` rejects a file whose
# bytes do not match. A stale manifest therefore does not fail loudly here - it
# fails on a user's machine, as a skill that silently falls back to the CLI's
# bundled copy. Checking it on every push is much cheaper than diagnosing that.
name: Validate

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manifest is in sync with the skill files
        run: node scripts/build-manifest.js --check

      - name: Manifests are valid JSON
        run: |
          for file in .claude-plugin/marketplace.json .claude-plugin/plugin.json .cursor-plugin/plugin.json .kimi-plugin/plugin.json .codex-plugin/plugin.json .agents/plugins/marketplace.json plugin.json mcp.json manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" && echo "ok $file"
          done

      # Codex supports exactly one Agent Plugins version and rejects a manifest
      # that targets any other with `unsupported Agent Plugins schema`, which
      # disables the plugin rather than degrading it. The spec already has a
      # 1.1.0, so a well-meaning bump here is a realistic way to break the Codex
      # route, and it would not show up in any other check.
      - name: Codex manifests target the Agent Plugins version Codex supports
        run: |
          status=0
          check () {
            actual=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('$1','utf8'))['\$schema']))")
            if [ "$actual" != "$2" ]; then
              echo "::error file=$1::\$schema is '$actual', expected '$2'"
              status=1
            else
              echo "ok $1"
            fi
          }
          check plugin.json https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          check mcp.json https://agent-plugins.org/schemas/1.0.0/mcp.schema.json
          exit $status

      - name: Every skill has frontmatter Claude Code can load
        run: |
          status=0
          for skill in skills/*/SKILL.md; do
            head -1 "$skill" | grep -qx -- '---' || { echo "::error file=$skill::missing YAML frontmatter"; status=1; }
            grep -qE '^name:' "$skill" || { echo "::error file=$skill::frontmatter has no name"; status=1; }
            grep -qE '^description:' "$skill" || { echo "::error file=$skill::frontmatter has no description"; status=1; }
          done
          exit $status
