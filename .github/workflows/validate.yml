# Independent concerns, one parallel job each, so a failure names itself:
# `skills` checks what Claude Code loads from skills/ and that every
# `postman:<name>` the repo ships names one of them, `manifest` checks the
# index `postman init` fetches, `opencode` builds and loads the OpenCode plugin,
# `installer` unit-tests `npx @postman/postman-plugin` (installer-smoke.yml runs
# it against the real agent CLIs), `pi` loads that package's tarball into Pi,
# `factory` installs this checkout into Droid, `schema` checks each vendor
# plugin manifest against that vendor's own published schema. The installer,
# OpenCode, Pi and Droid jobs each run on Linux and Windows.
name: Validate

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure bash - no setup-node here on purpose.
      - name: Every skill has frontmatter Claude Code can load
        run: |
          status=0
          for skill in skills/*/SKILL.md; do
            head -1 "$skill" | grep -qx -- '---' || { echo "::error file=$skill::missing YAML frontmatter"; status=1; }
            grep -qE '^name:' "$skill" || { echo "::error file=$skill::frontmatter has no name"; status=1; }
            grep -qE '^description:' "$skill" || { echo "::error file=$skill::frontmatter has no description"; status=1; }
          done
          exit $status

      # An agent relays a stale postman:<name> to the user as-is. intent.md is a
      # historical record of retired skill names, so it is not scanned.
      - name: Every postman:<name> reference names a real skill
        run: |
          status=0
          while IFS=: read -r file line ref; do
            [ -d "skills/${ref#postman:}" ] || { echo "::error file=$file,line=$line::$ref names no skill under skills/"; status=1; }
          done < <(grep -rnoE 'postman:[a-z0-9-]+' skills hooks README.md CONTRIBUTING.md)
          exit $status

  # The manifest carries a sha256 per file, and `postman init` rejects a file whose
  # bytes do not match. A stale manifest therefore does not fail loudly here - it
  # fails on a user's machine, as a skill that silently falls back to the CLI's
  # bundled copy. Checking it on every push is much cheaper than diagnosing that.
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manifest is in sync with the skill files
        run: node scripts/build-manifest.js --check

      - name: Every JSON file parses
        run: node scripts/check-json.js

      - name: Routes agree with their MCP configs
        run: node .claude/hooks/validate-manifests.js

      # SchemaStore's Claude Code schemas check structure and types but accept
      # invalid plugin names and unknown keys; Claude Code's own validator catches
      # those, so both run.
      - name: Claude Code accepts the marketplace and plugin manifests
        run: npx -y @anthropic-ai/claude-code plugin validate .

  # The only route that runs code. Its harness installs the plugin as a user
  # does and has the pinned OpenCode CLI load every skill.
  opencode:
    name: OpenCode package / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    defaults:
      run:
        shell: bash
        working-directory: opencode
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install development dependencies
        run: npm ci

      - name: Unit tests
        # `npm test` with both reporters; node reads them only ahead of the test files.
        run: |
          npm run build
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/unit-tests.tap" test/*.test.js

      # A green run that skipped tests hid that Windows ran nothing end to end.
      - name: No unit test was skipped
        run: |
          test -s "$RUNNER_TEMP/unit-tests.tap"
          if grep -E '# SKIP' "$RUNNER_TEMP/unit-tests.tap"; then exit 1; fi

      - name: Packed-install harness
        run: npm run test:harness

      - name: Eval cases cover every skill
        run: npm run eval:skills:validate

  # On Windows npm installs the agent CLIs as `.cmd` shims, which system.ts
  # starts through cmd.exe; only a Windows runner takes that path.
  installer:
    name: Installer package / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    defaults:
      run:
        shell: bash
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install development dependencies
        run: npm ci

      # Includes a test that fails when a route in scripts/routes.js has no installer adapter.
      # `npm test` with both reporters, which node reads only ahead of the test files. Not in
      # Git Bash: its runtime enables the backup privilege, which the ACL tests' deny bypasses.
      - name: Unit tests
        shell: pwsh
        run: npm run build && node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=unit-tests.tap test/*.test.js

      # A green run that skipped tests hid that Windows ran nothing end to end. Windows
      # skips nothing; elsewhere only a test of the Windows process layer may skip.
      - name: No unit test was skipped but a Windows-only one off Windows
        env:
          ALLOWED_SKIP: ${{ runner.os == 'Windows' && '^$' || '# SKIP Windows only$' }}
        run: |
          test -s unit-tests.tap
          if grep -E '# SKIP' unit-tests.tap | grep -v -E "$ALLOWED_SKIP"; then exit 1; fi

  # Pi installs the installer's npm tarball as a Pi package. The harness packs it,
  # installs it into a pinned Pi, and checks what Pi sends the model.
  pi:
    name: Pi package / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    defaults:
      run:
        shell: bash
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install development dependencies
        run: npm ci

      # Pinned so a Pi release can't fail a PR on its own; installer-smoke.yml runs the latest nightly.
      - name: Install Pi
        run: npm install --no-save --prefix "$RUNNER_TEMP/pi" @earendil-works/pi-coding-agent@0.99.1

      - name: Pi loads the skills, the mandate and the MCP server from the tarball
        run: npm run test:pi-harness
        env:
          PI_BIN: ${{ runner.temp }}/pi/node_modules/.bin/pi${{ runner.os == 'Windows' && '.cmd' || '' }}

  # Droid installs this repo from its marketplace. The harness installs the checkout
  # into a pinned Droid and checks what Droid sends the model and the MCP server.
  factory:
    name: Factory Droid plugin / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Pinned so a Droid release can't fail a PR on its own; installer-smoke.yml runs the latest nightly.
      - name: Install Droid
        run: npm install --no-save --prefix "$RUNNER_TEMP/droid" droid@0.231.0

      - name: Droid loads the skills, the mandate and the MCP server from the marketplace
        run: node scripts/factory-harness.js
        env:
          DROID_BIN: ${{ runner.temp }}/droid/node_modules/.bin/droid${{ runner.os == 'Windows' && '.cmd' || '' }}

  # One check per official schema. Schemas are fetched from the vendor's source
  # on every run, so a vendor tightening its schema fails CI here rather than
  # at marketplace review. Files with no published schema (.kimi-plugin/plugin.json,
  # .codex-plugin/plugin.json, .factory-plugin/*.json, the other mcp.*.json,
  # mcp.json, manifest.json) are covered by the `manifest` job above. Codex
  # documents its manifest in prose only and publishes no schema for it; the
  # agent-plugins.org schema is not a substitute, since it describes the
  # root-level `plugin.json` Agent Plugins format, which Codex selects by path
  # and which .codex-plugin/plugin.json is deliberately not.
  schema:
    name: Schema / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Claude Code marketplace
            file: .claude-plugin/marketplace.json
            schema: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/claude-code-marketplace.json
            spec: draft7
          - name: Claude Code plugin
            file: .claude-plugin/plugin.json
            schema: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/claude-code-plugin-manifest.json
            spec: draft7
          - name: Cursor plugin
            file: .cursor-plugin/plugin.json
            schema: https://raw.githubusercontent.com/cursor/plugins/main/schemas/plugin.schema.json
            spec: draft7
          # mcp.opencode.json is a valid OpenCode config fragment, so the config
          # schema checks its server block. That schema $refs models.dev for the
          # model union, and ajv resolves no reference over the network - without
          # `ref` the run fails on "can't resolve reference", not on our file.
          - name: OpenCode MCP config
            file: mcp.opencode.json
            schema: https://opencode.ai/config.json
            ref: https://models.dev/model-schema.json
            spec: draft2020
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch schema
        run: curl -fsSL "${{ matrix.schema }}" -o "$RUNNER_TEMP/schema.json"

      - name: Fetch referenced schema
        if: matrix.ref != ''
        run: curl -fsSL "${{ matrix.ref }}" -o "$RUNNER_TEMP/ref.json"

      - name: Validate ${{ matrix.file }}
        run: |
          # An array, not a string: `-r <file>` has to arrive as two argv entries,
          # and an unquoted string to get that would also glob and word-split.
          args=(--spec=${{ matrix.spec }} -c ajv-formats --strict=false --all-errors
                -s "$RUNNER_TEMP/schema.json")
          if [ -f "$RUNNER_TEMP/ref.json" ]; then
            args+=(-r "$RUNNER_TEMP/ref.json")
          fi
          npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate "${args[@]}" -d "${{ matrix.file }}"
