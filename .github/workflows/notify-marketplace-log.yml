# Reports every client manifest's version to the Marketplace Log Slack app
# (postman-eng/marketplace-log), which posts to #postman-plugin-marketplaces
# only for listings whose version file actually changed version.
name: Notify marketplace channel

on:
  push:
    branches: ['main']
    paths:
      - '.claude-plugin/plugin.json'
      - '.cursor-plugin/plugin.json'
      - '.codex-plugin/plugin.json'
      - '.kimi-plugin/plugin.json'
      - 'opencode.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report manifest versions
        env:
          WEBHOOK: ${{ secrets.MARKETPLACE_LOG_WEBHOOK }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::MARKETPLACE_LOG_WEBHOOK is not set; skipping"
            exit 0
          fi

          report() {
            local file="$1" query="$2" version
            version="$(jq -r "$query // empty" "$file")"
            if [ -z "$version" ]; then
              echo "::warning file=$file::no version at $query"
              return
            fi
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg file "$file" \
                  --arg version "$version" --arg url "$COMMIT_URL" \
                  '{repo: $repo, version_file: $file, version: $version, release_url: $url}' |
              curl -fsS -X POST "$WEBHOOK" -H 'Content-Type: application/json' --data @- >/dev/null
            echo "$file: $version"
          }

          report .claude-plugin/plugin.json '.version'
          report .cursor-plugin/plugin.json '.version'
          report .codex-plugin/plugin.json '.version'
          report .kimi-plugin/plugin.json '.version'
          report opencode.json '.mcp.postman.headers["X-Plugin-Version"]'
