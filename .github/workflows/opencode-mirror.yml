# Keeps postmanlabs/opencode-plugin, the package `opencode plugin add github:postmanlabs/opencode-plugin`
# installs, in step with main: a push that changes what the package holds rebuilds it with
# opencode/scripts/build-mirror.js and commits it there. release.yml tags it. The next sync overwrites
# any edit to the files it generates; the mirror's own files, such as SECURITY.md, stay.
name: OpenCode mirror

on:
  push:
    branches: ['main']
    paths:
      - 'skills/**'
      - 'hooks/session-start-context.md'
      - 'manifest.json'
      - 'mcp.opencode.json'
      - 'LICENSE'
      - 'opencode/src/**'
      - 'opencode/package.json'
      - 'opencode/scripts/build-mirror.js'
      - '.github/scripts/push-mirror.sh'
      - '.github/workflows/opencode-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

# In push order, so an older commit can't land after a newer one.
concurrency:
  group: opencode-mirror
  queue: max

jobs:
  sync:
    name: Sync postmanlabs/opencode-plugin
    # A dispatch can name any branch, and this always replaces the mirror's main.
    if: github.repository == 'postmanlabs/postman-plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Commit it to postmanlabs/opencode-plugin
        env:
          OPENCODE_PLUGIN_TOKEN: ${{ secrets.OPENCODE_PLUGIN_TOKEN }}
        run: bash .github/scripts/push-mirror.sh main "$GITHUB_SHA"
